name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Build + Test (Core + Tests — bez MAUI) ──────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SmogWawelski.Core/SmogWawelski.Core.csproj

      - name: Build Core
        run: dotnet build SmogWawelski.Core/SmogWawelski.Core.csproj --no-restore -c Release

      - name: Run Tests
        run: dotnet test SmogWawelski.Tests/SmogWawelski.Tests.csproj -c Release --no-build --logger "github" --results-directory TestResults
        env:
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

  # ── Build Windows (sprawdź czy MAUI się kompiluje) ──────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install maui-windows

      - name: Build Windows
        run: dotnet build SmogWawelski.csproj -f net10.0-windows10.0.19041.0 -c Release
