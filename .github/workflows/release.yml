name: Release Android APK

on:
  push:
    tags:
      - 'v*.*.*'   # Trigger: git tag v1.0.0 && git push --tags

permissions:
  contents: write   # potrzebne do gh-release create

jobs:
  android-apk:
    name: Build & Publish APK
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads
        run: dotnet workload install maui

      - name: Run tests before release
        run: dotnet test SmogWawelski.Tests/SmogWawelski.Tests.csproj -c Release

      - name: Build Android APK
        run: |
          dotnet publish SmogWawelski.csproj `
            -f net10.0-android `
            -c Release `
            -p:AndroidSigningKeyStore=debug.keystore `
            -p:AndroidSigningKeyAlias=androiddebugkey `
            -p:AndroidSigningKeyPass=android `
            -p:AndroidSigningStorePass=android

      - name: Find APK
        id: apk
        run: |
          $apk = Get-ChildItem -Recurse -Filter "*-Signed.apk" | Select-Object -First 1
          echo "path=$($apk.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($apk.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmogWawelski-${{ github.ref_name }}.apk
          path: ${{ steps.apk.outputs.path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: SmogWawelski ${{ github.ref_name }}
          body: |
            ## 🚋 SmogWawelski ${{ github.ref_name }}

            ### Instalacja na Android
            1. Pobierz plik `.apk`
            2. Włącz **"Instalacja z nieznanych źródeł"** w ustawieniach
            3. Otwórz plik APK i zainstaluj

            ### Zmiany
            See [CHANGELOG](CHANGELOG.md) or commit history.
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
